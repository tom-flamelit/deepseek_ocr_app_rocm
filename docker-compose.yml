services:
  backend:
    build: ./backend
    container_name: deepseek-ocr-backend
    environment:
      MODEL_NAME: deepseek-ai/DeepSeek-OCR
      HF_HOME: /models
      ROCR_VISIBLE_DEVICES: all
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}
    volumes:
      - ./models:/models
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    shm_size: "4g"
    ports:
      - "8000:8000"
    networks:
      - ocr-network

  frontend:
    build: ./frontend
    container_name: deepseek-ocr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ocr-network

networks:
  ocr-network:
    driver: bridge
